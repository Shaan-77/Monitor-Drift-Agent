# zeroui-simulator-owned
name: ZeroUI FM-1 ER-056 Required Gate
run-name: ZeroUI ER-056 Required Gate ${{ github.sha }}

on:
  push:
    branches:
      - "zeroui-trigger-simulator/workspace/0d5770c03205"
    paths:
      - ".github/workflows/zeroui-fm1-simulator-er056-required-gate.yml"
      - ".zeroui-simulator/ci/current/er056/target-trigger.json"

permissions:
  contents: read

jobs:
  zeroui-fm1-er056-required-gate:
    name: ZeroUI FM-1 ER-056 Required Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify ER-056 target trigger correlation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path
          trigger_path = Path(".zeroui-simulator/ci/current/er056/target-trigger.json")
          scenario_path = Path(".zeroui-simulator/ci/current/er056/scenario.json")
          if not trigger_path.is_file():
              print(f"Missing target trigger file: {trigger_path}", file=sys.stderr)
              raise SystemExit(2)
          if not scenario_path.is_file():
              print(f"Missing scenario file: {scenario_path}", file=sys.stderr)
              raise SystemExit(2)
          trigger = json.loads(trigger_path.read_text(encoding="utf-8"))
          scenario = json.loads(scenario_path.read_text(encoding="utf-8"))
          if str(trigger.get("simulator_run_id") or "") != str(scenario.get("simulator_run_id") or ""):
              print("target-trigger simulator_run_id mismatch", file=sys.stderr)
              raise SystemExit(2)
          if str(trigger.get("expected_branch") or "") != "zeroui-trigger-simulator/workspace/0d5770c03205":
              print("target-trigger expected_branch mismatch", file=sys.stderr)
              raise SystemExit(2)
          if str(trigger.get("expected_workflow_path") or "") != ".github/workflows/zeroui-fm1-simulator-er056-required-gate.yml":
              print("target-trigger expected_workflow_path mismatch", file=sys.stderr)
              raise SystemExit(2)
          PY

      - name: Await required-gate cancellation
        shell: bash
        run: |
          set -euo pipefail
          echo "ZeroUI ER-056 required gate awaiting simulator cancellation..."
          for _ in $(seq 1 120); do
            sleep 10
          done
