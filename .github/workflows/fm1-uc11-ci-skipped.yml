name: FM1 UC11 CI skipped signal

"on":
  workflow_dispatch:
    inputs:
      fm1_event:
        description: "FM-1 event to send"
        required: true
        default: "ci.check.skipped"
        type: choice
        options:
          - ci.check.skipped
          - ci.workflow.skipped

jobs:
  send-fm1-ci-signal:
    name: Send FM-1 CI skipped signal
    runs-on: ubuntu-latest

    steps:
      - name: Build FM-1 payload
        shell: bash
        env:
          FM1_TENANT_ID: ${{ vars.FM1_TENANT_ID }}
          FM1_RELEASE_ID: ${{ vars.FM1_RELEASE_ID }}
          FM1_EVENT_TYPE: ${{ github.event.inputs.fm1_event }}
          GHA_REPOSITORY: ${{ github.repository }}
          GHA_REF_NAME: ${{ github.ref_name }}
          GHA_SHA: ${{ github.sha }}
          GHA_WORKFLOW: ${{ github.workflow }}
          GHA_RUN_ID: ${{ github.run_id }}
          GHA_RUN_ATTEMPT: ${{ github.run_attempt }}
          GHA_JOB: send-fm1-ci-signal
        run: |
          set -euo pipefail

          if [ -z "${FM1_TENANT_ID}" ]; then
            echo "ERROR: GitHub Actions variable FM1_TENANT_ID is missing."
            exit 1
          fi

          if [ -z "${FM1_RELEASE_ID}" ]; then
            echo "ERROR: GitHub Actions variable FM1_RELEASE_ID is missing."
            exit 1
          fi

          if [ -z "${FM1_EVENT_TYPE}" ]; then
            echo "ERROR: workflow input fm1_event is missing."
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os

          event_type = os.environ["FM1_EVENT_TYPE"]
          run_id = os.environ["GHA_RUN_ID"]
          run_attempt = os.environ.get("GHA_RUN_ATTEMPT", "1")
          job_id = os.environ.get("GHA_JOB", "send-fm1-ci-signal")

          payload = {
              "schema_version": 1,
              "tenant_id": os.environ["FM1_TENANT_ID"],
              "release_id": os.environ["FM1_RELEASE_ID"],
              "trace_id": f"trace-github-actions-uc11-{event_type}-{run_id}-{run_attempt}",
              "source_event_id": f"github-actions-uc11-{event_type}-{run_id}-{job_id}-{run_attempt}",
              "provider": "github_actions",
              "platform": "GitHub Actions",
              "source_system": "ci_cd",
              "signal_method": "pipeline_job",
              "event_type_id": event_type,
              "repository": os.environ["GHA_REPOSITORY"],
              "branch": os.environ["GHA_REF_NAME"],
              "commit_hash": os.environ["GHA_SHA"],
              "workflow_name": os.environ["GHA_WORKFLOW"],
              "workflow_run_id": run_id,
              "pipeline_id": run_id,
              "job_id": job_id,
              "run_id": run_id,
              "payload": {
                  "check_name": "fm1-ci-proof",
                  "conclusion": "skipped",
                  "reason": "Manual UAT UC-11: CI check/workflow intentionally skipped"
              },
              "raw_metadata": {
                  "ci_runner_marker": "github_actions",
                  "ci_runner_detected": True,
                  "github_actions": True,
                  "run_attempt": run_attempt
              }
          }

          with open("payload.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

          echo "Payload prepared:"
          cat payload.json

      - name: Send CI skipped event to FM-1
        shell: bash
        env:
          FM1_BASE_URL: ${{ vars.FM1_BASE_URL }}
          FM1_TOKEN: ${{ secrets.FM1_SIGNAL_INTAKE_AUTH_TOKEN }}
        run: |
          set +e

          if [ -z "${FM1_BASE_URL}" ]; then
            echo "ERROR: GitHub Actions variable FM1_BASE_URL is missing."
            exit 1
          fi

          if [ -z "${FM1_TOKEN}" ]; then
            echo "ERROR: GitHub Actions secret FM1_SIGNAL_INTAKE_AUTH_TOKEN is missing or empty."
            exit 1
          fi

          echo "FM-1 token secret is present. Token length: ${#FM1_TOKEN}"
          echo "Sending to: ${FM1_BASE_URL}/fm1/v1/ci/signals"

          HTTP_CODE=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST "${FM1_BASE_URL}/fm1/v1/ci/signals" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${FM1_TOKEN}" \
            -H "X-ZeroUI-Intake-Token: ${FM1_TOKEN}" \
            -H "X-FM1-Signal-Intake-Auth-Token: ${FM1_TOKEN}" \
            -H "X-FM1-Auth-Token: ${FM1_TOKEN}" \
            --data @payload.json)

          echo "FM-1 HTTP status: ${HTTP_CODE}"
          echo "FM-1 response:"
          cat response.json || true

          if [ "${HTTP_CODE}" -eq 401 ]; then
            echo "AUTH FAILED: FM-1 endpoint was reached, but intake auth failed."
            exit 1
          fi

          if [ "${HTTP_CODE}" -eq 400 ]; then
            echo "BAD REQUEST: FM-1 rejected the CI signal envelope. Review response reason_code."
            exit 1
          fi

          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "FM-1 call returned non-2xx. Review response."
            exit 1
          fi
