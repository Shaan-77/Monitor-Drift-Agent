name: FM1 UC11 CI skipped signal

on:
  workflow_dispatch:
    inputs:
      fm1_event:
        description: "FM-1 event to send"
        required: true
        default: "ci.check.skipped"
        type: choice
        options:
          - ci.check.skipped
          - ci.workflow.skipped

jobs:
  send-fm1-ci-signal:
    name: Send FM-1 CI skipped signal
    runs-on: ubuntu-latest

    steps:
      - name: Build FM-1 payload
        shell: bash
        run: |
          EVENT_TYPE="${{ github.event.inputs.fm1_event }}"
          SOURCE_EVENT_ID="github-actions-uc11-${EVENT_TYPE}-${{ github.run_id }}"

          cat > payload.json <<EOF
          {
            "tenant_id": "${{ vars.FM1_TENANT_ID }}",
            "release_id": "${{ vars.FM1_RELEASE_ID }}",
            "source_event_id": "${SOURCE_EVENT_ID}",
            "provider": "github_actions",
            "platform": "GitHub Actions",
            "source_system": "ci_cd",
            "signal_method": "pipeline_job",
            "event_type_id": "${EVENT_TYPE}",
            "repository": "${{ github.repository }}",
            "branch": "${{ github.ref_name }}",
            "commit_hash": "${{ github.sha }}",
            "check_name": "required-build",
            "workflow_name": "${{ github.workflow }}",
            "workflow_run_id": "${{ github.run_id }}",
            "reason": "Manual UAT UC-11: CI check/workflow intentionally skipped"
          }
          EOF

          echo "Payload prepared:"
          cat payload.json

      - name: Send CI skipped event to FM-1
        shell: bash
        run: |
          set +e

          HTTP_CODE=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST "${{ vars.FM1_BASE_URL }}/fm1/v1/ci/signals" \
            -H "Content-Type: application/json" \
            --data @payload.json)

          echo "FM-1 HTTP status: ${HTTP_CODE}"
          echo "FM-1 response:"
          cat response.json || true

          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "FM-1 call returned non-2xx. This may still be policy-blocking behavior, but the transport/API response must be reviewed."
            exit 1
          fi
