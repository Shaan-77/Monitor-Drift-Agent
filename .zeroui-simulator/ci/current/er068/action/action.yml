name: "ZeroUI FM-1 Governance Gate"
description: "Builds a ZeroUI FM-1 CI signal from evidence, sends it to FM-1, and enforces the returned governance decision."
inputs:
  evidence_file:
    description: "Path to the evidence file generated by the workflow."
    required: true
  evidence_format:
    description: "Evidence format. Supported values: github-workflow-failure."
    required: true
  job_id:
    description: "Optional stable job id to send to ZeroUI. Defaults to the GitHub job name when available."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Run ZeroUI FM-1 governance gate
      shell: bash
      env:
        ZEROUI_EVIDENCE_FILE: ${{ inputs.evidence_file }}
        ZEROUI_EVIDENCE_FORMAT: ${{ inputs.evidence_format }}
        ZEROUI_JOB_ID: ${{ inputs.job_id }}
      run: |
        set -euo pipefail
        python3 "${GITHUB_ACTION_PATH}/zeroui_fm1_governance.py"
